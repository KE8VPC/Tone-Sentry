[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tone-page-detect"
version = "0.8.17"
description = "Portable radio paging monitor with redundant receiver coordination"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "sounddevice>=0.5,<0.6", "requests>=2.32,<3", "tzdata>=2024.1", "cryptography>=46,<51", "Flask>=3.1.3,<3.2", "cheroot>=11.1.2,<12", "psutil>=7,<8"]

[project.optional-dependencies]
encoder = ["imageio-ffmpeg>=0.6,<0.7"]
test = ["pytest>=8,<10", "build>=1,<2", "pyftpdlib>=2,<3"]

[project.scripts]
tonesentry = "tonepage.cli:main"
tone-page-detect = "tonepage.cli:main"

[tool.setuptools.packages.find]
include = ["tonepage*"]

[tool.setuptools.package-data]
tonepage = ["resources/*.json", "resources/*.pdf", "resources/*.md", "resources/*.png", "resources/*.ico", "resources/*.html", "resources/*.css", "resources/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
